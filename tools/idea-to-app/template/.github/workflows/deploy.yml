# On every push to main: test, then publish.
#
# With the CLOUDFLARE_API_TOKEN secret: the site and its API are one Cloudflare Worker (worker/) with a
# D1 database. Once SITE_DOMAIN's zone is active in that Cloudflare account, the Worker answers at
# https://SITE_DOMAIN (http→https, www→bare, HSTS, CSP); until then at its workers.dev address.
# After every deploy the live site is checked: this exact version answers, the API reads/writes,
# a stale write is rejected, the counter works, and the security headers are present.
# Without the secret: the site (no sync/counter) goes to GitHub Pages from the gh-pages branch.
# CLOUDFLARE_ACCOUNT_ID (secret or variable) is optional: without it wrangler uses the token's account.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  SITE_DOMAIN: __DOMAIN__   # keep in sync with worker/wrangler.toml (CANONICAL_HOST, ALLOWED_ORIGINS)
  APP_SLUG: __APP_SLUG__
  WRANGLER: npx --yes wrangler@4.149.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Cloudflare credentials and domain status
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_TOKEN" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Tolerate stray whitespace, or token and account id pasted together into the token secret:
          # a 32-hex line is the account id, the other line is the token.
          token=""; acct="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^[0-9a-f]{32}$ ]]; then [ -n "$acct" ] || acct="$line"
            elif [ -z "$token" ]; then token="$line"
            else echo "::error::CLOUDFLARE_API_TOKEN holds more than one token-like line"; exit 1
            fi
          done <<< "$RAW_TOKEN"
          [ -n "$token" ] || { echo "::error::CLOUDFLARE_API_TOKEN has no token in it"; exit 1; }
          echo "::add-mask::$token"; echo "CF_API_TOKEN=$token" >> "$GITHUB_ENV"
          if [ -n "$acct" ]; then echo "::add-mask::$acct"; echo "CF_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"; fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          zones="$(curl -s -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones?name=$SITE_DOMAIN")"
          status="$(jq -r '.result[0].status // "missing"' <<< "$zones")"
          echo "zone=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### Domain $SITE_DOMAIN"
            case "$status" in
              active)  echo "Active in Cloudflare — the site is served there." ;;
              missing) echo "Not added to this Cloudflare account yet (Add a domain → $SITE_DOMAIN). The site stays on GitHub Pages." ;;
              *)       echo "Zone status: **$status**. Set these nameservers at the registrar:"
                       jq -r '.result[0].name_servers[]? | "- `" + . + "`"' <<< "$zones" ;;
            esac
            echo "Current nameservers: $(dig +short NS "$SITE_DOMAIN" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the site for Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        run: npx vite build --base=/ --outDir dist-cf
        env:
          VITE_SYNC_URL: /   # sync API on the same domain
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}

      - name: Deploy to Cloudflare (site + sync API)
        id: worker
        if: steps.cf.outputs.enabled == 'true'
        working-directory: worker
        env:
          ZONE: ${{ steps.cf.outputs.zone }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          if [ -n "${CF_ACCOUNT_ID:-}" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"; fi
          db_id() { $WRANGLER d1 list --json | jq -r '.[] | select(.name == env.APP_SLUG) | .uuid'; }
          ID="$(db_id)"
          if [ -z "$ID" ]; then
            # create outside this folder so wrangler doesn't try to edit wrangler.toml
            (cd "$RUNNER_TEMP" && $WRANGLER d1 create "$APP_SLUG")
            ID="$(db_id)"
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          if [ "$ZONE" = active ]; then
            sed -i "s|^# __ROUTES__|routes = [\n  { pattern = \"$SITE_DOMAIN\", custom_domain = true },\n  { pattern = \"www.$SITE_DOMAIN\", custom_domain = true },\n]|" wrangler.toml
          fi
          $WRANGLER d1 execute "$APP_SLUG" --remote --file schema.sql --yes
          $WRANGLER deploy --var "APP_VERSION:${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/deploy.log"
          WORKERS_URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          test -n "$WORKERS_URL" || { echo "::error::No workers.dev URL in deploy output"; exit 1; }
          echo "workers_url=$WORKERS_URL" >> "$GITHUB_OUTPUT"
          if [ "$ZONE" = active ]; then
            echo "site_url=https://$SITE_DOMAIN" >> "$GITHUB_OUTPUT"; echo "custom=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=$WORKERS_URL" >> "$GITHUB_OUTPUT"; echo "custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the live site and sync API
        if: steps.worker.outcome == 'success'
        env:
          URL: ${{ steps.worker.outputs.site_url }}
          ORIGIN: https://${{ env.SITE_DOMAIN }}
        run: |
          set -euo pipefail
          # a new custom domain needs a few minutes for its certificate, and a new version
          # a few seconds to reach every Cloudflare location: wait until this very version answers
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 36); do
            got="$(curl -s -D - -o /tmp/index.html "$URL/" | grep -i '^x-app-version:' | tr -d '\r' | awk '{print $2}')"
            [ "$got" = "$want" ] && grep -q 'id="root"' /tmp/index.html && break
            echo "waiting for version $want at $URL (now: ${got:-none}) ($i)…"; sleep 5
          done
          [ "$got" = "$want" ] || { echo "::error::$URL still serves version '${got:-none}', expected $want"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "::error::$URL/ does not serve the site"; exit 1; }
          id="$(head -c 32 /dev/urandom | sha256sum | cut -c1-64)"
          code="$(curl -s -o /tmp/get.json -w '%{http_code}' "$URL/v1/s/$id")"
          [ "$code" = 404 ] && grep -q not_found /tmp/get.json || { echo "::error::GET unknown id: HTTP $code"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -d "{\"iv\":\"AAAAAAAAAAAAAAAA\",\"data\":\"c21va2U=\",\"updatedAt\":$(date +%s)000}" "$URL/v1/s/$id")"
          [ "$code" = 200 ] || { echo "::error::PUT: HTTP $code"; exit 1; }
          curl -s "$URL/v1/s/$id" | grep -q '"data":"c21va2U="' || { echo "::error::GET after PUT returned other data"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            -d '{"iv":"AAAAAAAAAAAAAAAA","data":"b2xk","updatedAt":1}' "$URL/v1/s/$id")"
          [ "$code" = 409 ] || { echo "::error::older write was not rejected: HTTP $code"; exit 1; }
          code="$(curl -s -o /tmp/stats.json -w '%{http_code}' "$URL/v1/stats")"
          [ "$code" = 200 ] && grep -q '"users"' /tmp/stats.json || { echo "::error::user counter: HTTP $code"; exit 1; }
          if [ "${{ steps.worker.outputs.custom }}" = true ]; then
            # protected version: http and www end up on https://SITE_DOMAIN, pages carry HSTS and CSP
            loc="$(curl -s -o /dev/null -w '%{redirect_url}' "http://$SITE_DOMAIN/v1?x=1")"
            [ "$loc" = "https://$SITE_DOMAIN/v1?x=1" ] || { echo "::error::http → https redirect goes to '$loc'"; exit 1; }
            loc="$(curl -s -o /dev/null -w '%{redirect_url}' "https://www.$SITE_DOMAIN/")"
            [ "$loc" = "https://$SITE_DOMAIN/" ] || { echo "::error::www redirect goes to '$loc'"; exit 1; }
            hdrs="$(curl -sI "$URL/")"
            for h in strict-transport-security content-security-policy x-content-type-options x-frame-options; do
              grep -qi "^$h:" <<< "$hdrs" || { echo "::error::missing header $h"; exit 1; }
            done
          fi
          echo "Live check passed at $URL (site, sync read/write/stale-write, user counter, https + security headers)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Pages (no Cloudflare token)
        if: steps.cf.outputs.enabled != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}
        run: |
          set -euo pipefail
          npx vite build --base="/${GITHUB_REPOSITORY#*/}/"
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to GitHub Pages (Settings → Pages → Deploy from a branch: gh-pages)" >> "$GITHUB_STEP_SUMMARY"
