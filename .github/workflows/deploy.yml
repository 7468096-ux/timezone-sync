# On every push to main: test, deploy the device-sync service to Cloudflare (when its secrets
# are set), build the site pointing at that service, and publish the build to the gh-pages branch.
#
# GitHub Pages serves the gh-pages branch (repo Settings → Pages → "Deploy from a branch": gh-pages).
# Sync needs the repository secret CLOUDFLARE_API_TOKEN. CLOUDFLARE_ACCOUNT_ID (secret or variable)
# is optional: without it wrangler picks the token's account. Without the token the site is still
# published, just without the "Sync devices" button.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Deploy sync service to Cloudflare
        id: sync
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          set -euo pipefail
          # an empty account id would be passed through as-is; let wrangler find the token's account instead
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || unset CLOUDFLARE_ACCOUNT_ID
          WR="npx --yes wrangler@4.149.0"
          db_id() { $WR d1 list --json | jq -r '.[] | select(.name == "tz-sync") | .uuid'; }
          ID="$(db_id)"
          if [ -z "$ID" ]; then
            # create outside this folder so wrangler doesn't try to edit wrangler.toml
            (cd "$RUNNER_TEMP" && $WR d1 create tz-sync)
            ID="$(db_id)"
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          $WR d1 execute tz-sync --remote --file schema.sql --yes
          $WR deploy | tee "$RUNNER_TEMP/deploy.log"
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          test -n "$URL" || { echo "No workers.dev URL in deploy output"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Sync service: $URL" >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build
        env:
          VITE_SYNC_URL: ${{ steps.sync.outputs.url }}

      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
